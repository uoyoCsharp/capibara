    acceptance:
      - "suspend() never sends protocol closeSession; status becomes 'suspended'"
      - "close()/expire() send protocol closeSession and persist closeReason"
      - "resume() dispatches resume|load|rebuild by strategy; rebuild re-derives cwd/mcpServers/allowedPaths"
      - "Invalid transitions are rejected by the state machine; unit tests cover transitions"

