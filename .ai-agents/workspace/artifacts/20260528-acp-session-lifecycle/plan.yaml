    completed_at: "2026-05-29T03:10:00"
    result: "tsc clean (whole project); 41 manager+executor+lifecycle tests pass, 144 ACP-dir tests pass / 13 skipped. Deviations: deprecated resumeSession/closeSession shims kept until t5; reconcileOnStartup bypasses assertTransition (crash-recovery); rebuild context re-derivation deferred to t7/t8 via injected SessionRebuilder seam."
    notes: >
      ADR-1/2/3/5/6. Rework AcpSessionManager: suspend(reason) WITHOUT protocol
      close, resume (resume|load|rebuild), close(reason) with protocol close,
      expire. Repo-backed state with in-memory write-through cache for live
      connections. Implement rebuild (fresh session + re-derived context) last.
