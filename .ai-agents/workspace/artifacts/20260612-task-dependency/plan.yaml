  - id: t2-repository-service
    title: Dependency repository and service with cycle detection
    status: done
    completed_at: 2026-06-12T06:42:04.496Z
    depends_on:
      - t1-migration-types
    project:
      - electron
    skill_hint: mvt-implement
    artifacts:
      files:
        - apps/electron/src/core/modules/workflow/interfaces/i-task-dependency.repository.ts
        - apps/electron/src/core/modules/workflow/persistence/sqlite-task-dependency.repository.ts
        - apps/electron/src/core/modules/workflow/services/task-dependency.service.ts
    notes: >
      Create ITaskDependencyRepository interface with methods: findById, findByDependentTaskId, findByDependencyTaskId, findByOrgId, create, deleteByDependentTaskId, deleteByDependencyTaskId,
      deleteByTaskId, hasUnresolvedDependencies, canReach. Implement SqliteTaskDependencyRepository. Create TaskDependencyService with addDependency (includes DFS cycle detection via canReach) and
      removeDependency methods. Cycle detection: DFS from dependency_task_id following existing edges; if dependent_task_id is reachable, reject with ValidationError. Per ADR-01 and ADR-04.
    acceptance:
      - ITaskDependencyRepository interface defines all required methods
      - SqliteTaskDependencyRepository implements all methods with correct SQL
      - Cycle detection rejects A->B->A and A->B->C->A patterns
      - Cycle detection allows valid DAG dependencies
      - deleteByTaskId removes dependencies in both directions
      - tsc clean; existing tests pass
  - id: t3-state-machine-behavior
    title: State machine and behavior engine integration
    status: done
    completed_at: 2026-06-12T06:55:55.401Z
    depends_on:
      - t2-repository-service
    project:
      - electron
    skill_hint: mvt-implement
    artifacts:
      files:
        - apps/electron/src/core/modules/workflow/engines/task.state-machine.ts
        - apps/electron/src/core/modules/workflow/engines/behavior.engine.ts
        - apps/electron/src/core/modules/workflow/interfaces/i-task.service.ts
        - apps/electron/src/core/modules/workflow/interfaces/i-behavior.engine.ts
        - apps/electron/src/core/modules/workflow/services/task.service.ts
        - apps/electron/src/core/bootstrap/workflow.module.ts
        - apps/electron/src/core/bootstrap/composition-root.ts
    notes: >
      Inject ITaskDependencyRepository into TaskStateMachine. In transition(), when transitioning TO active category (in_progress), check hasUnresolvedDependencies and throw TaskStateError if true
      (defense in depth per ADR-05). After emitting task:completed, call behaviorEngine.onDependencyResolved(completedTask). Add onDependencyResolved method to BehaviorEngine: query dependents of
      completed task, check if all their dependencies are terminal, transition qualified tasks from blocked to pending. Extend ITaskService with addDependency/removeDependency/
      getDependencies/getDependents. Extend TaskService with dependency CRUD and batchCreate dependsOn resolution. Wire TaskDependencyRepository and TaskDependencyService in workflow.module.ts and
      composition-root.ts. Per ADR-02, ADR-03, ADR-05.
    acceptance:
      - TaskStateMachine rejects transition to active when unresolved dependencies exist
      - BehaviorEngine.onDependencyResolved transitions blocked->pending when all deps terminal
      - BehaviorEngine.onDependencyResolved leaves task blocked when deps remain
      - TaskService.addDependency creates dependency and transitions task to blocked
      - TaskService.batchCreate resolves dependsOn titles to task IDs
      - Workflow module wires all new dependencies correctly
      - tsc clean; existing tests pass
