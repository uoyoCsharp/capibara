tasks:
  - id: "t1-backend-model-support"
    title: "Backend model support: types, normalizer, store, session manager, wiring"
    status: done
    depends_on: []
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/core/modules/acp/types/acp.types.ts"
        - "apps/electron/src/core/modules/acp/client/model-state.ts"
        - "apps/electron/src/core/modules/acp/interfaces/i-model-preference.store.ts"
        - "apps/electron/src/core/modules/acp/persistence/sqlite-model-preference.store.ts"
        - "apps/electron/src/core/modules/acp/client/acp-session.manager.ts"
        - "apps/electron/src/core/modules/acp/interfaces/i-acp-session.manager.ts"
        - "apps/electron/src/core/bootstrap/acp.module.ts"
        - "apps/electron/src/core/bootstrap/composition-root.ts"
        - "apps/electron/tests/unit/acp/model-state.test.ts"
        - "apps/electron/tests/unit/acp/sqlite-model-preference.store.test.ts"
        - "apps/electron/tests/unit/acp/acp-session.manager.test.ts"
    notes: >
      ADR-1/2/3/4 — the whole main-process model feature in one cohesive pass.
      (1) Types (ADR-1): add AgentModelMechanism ('config_option'|'set_model'),
      AvailableModel ({id,name,description?}), ModelState ({models,currentModelId,
      mechanism,configId?}); extend SessionRuntimeContext.modelState.
      (2) Pure normalizer (model-state.ts): normalizeModelState(resp) with
      precedence configOptions(category==='model',type==='select') > models >
      empty, flattening SessionConfigSelectGroup option groups.
      (3) Store (ADR-2, supersedes analysis BR-6): IModelPreferenceStore +
      SqliteModelPreferenceStore over the SQLite settings key-value table (NOT
      config.json — no write-back path exists; reuse locale/scheduler_paused
      pattern). Keys 'acp:default-model' + 'acp:models-cache:<agentId>' (JSON).
      (4) Session manager (ADR-3/4): inject store; in createSession AND rebuild,
      after newSession → normalize → write-through cache → apply stored preference
      via setSessionConfigOption / unstable_setSessionModel ONLY when modelId is
      advertised (BR-3); agent-reject is WARN + non-fatal. Add getModelState
      (live ?? cache, merged with selected → ModelStateSummary) and
      setSelectedModel (validate ∈ list, persist ONLY — never call protocol on
      live sessions, REQ-6).
      (5) Wiring: construct the store in acp.module.ts, inject into the manager;
      composition-root passes sqliteConn; default agentId from agentConfig.
    acceptance:
      - "normalizeModelState is pure; unit tests cover configOptions(category=model), grouped options flattened, models-field fallback, empty/unsupported, and configId only for config_option"
      - "Store round-trips selected modelId and cached ModelState (per agentId) through the settings table; tests pass under the electron ABI runner"
      - "createSession/rebuild normalize + write-through cache and apply the stored preference via the detected mechanism only when the modelId is advertised; agent-reject is non-fatal (run continues on default, WARN logged)"
      - "setSelectedModel persists only, performs NO protocol call on any live session (REQ-6), and rejects a modelId not in the advertised list"
      - "App boots with the store wired via DI; tsc clean across the project; existing ACP tests still pass"

  - id: "t2-ipc-and-api"
    title: "IPC channels + shared API + preload passthrough"
    status: pending
    depends_on: ["t1-backend-model-support"]
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/core/ipc-handlers/acp.handlers.ts"
        - "apps/electron/src/core/shared/types.ts"
        - "apps/electron/src/core/shared/api.ts"
        - "apps/electron/src/core/preload/index.ts"
        - "apps/electron/tests/unit/preload-api-parity.test.ts"
    notes: >
      ADR-5, REQ-N1. Extend registerAcpHandlers with the session manager + default
      agentId. Add additive channels capibara:acp:model-state (get →
      ModelStateSummary) and capibara:acp:set-model (set(modelId) →
      ModelStateSummary; validates BR-3 server-side, err('VALIDATION') on reject).
      Add ModelStateSummary ({supported, models, currentModelId, selectedModelId})
      to core/shared/types.ts; getModelState/setSelectedModel on CapibaraApi;
      pure passthroughs in preload/index.ts. Update the preload-api-parity test.
    acceptance:
      - "Both channels return DesktopResult<ModelStateSummary>; preload is a pure passthrough"
      - "set-model returns err('VALIDATION') for a modelId not in the advertised list"
      - "CapibaraApi exposes getModelState/setSelectedModel; preload-api-parity test passes"

  - id: "t3-settings-ui"
    title: "Settings ModelSelector UI + locale strings"
    status: pending
    depends_on: ["t2-ipc-and-api"]
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/renderer/components/settings/ModelSelector.tsx"
        - "apps/electron/src/renderer/components/settings/AgentConfigPanel.tsx"
        - "apps/electron/src/shared/locale/en-US.ts"
        - "apps/electron/src/shared/locale/zh-CN.ts"
        - "apps/electron/src/shared/locale/types.ts"
    notes: >
      REQ-2/3/5/N4. New ModelSelector.tsx calls getModelState() on mount; when
      supported===false (empty models — covers both unsupported-agent and
      cold-start-no-cache, ADR-4) render a disabled selector + explanatory message;
      else render a dropdown with selectedModelId checked and currentModelId
      annotated, calling setSelectedModel(modelId) on change. Mount in
      AgentConfigPanel.tsx. Add all new strings to en-US + zh-CN with the
      LocaleMessages type in types.ts (no hard-coded display strings).
    acceptance:
      - "Selector lists advertised models with the saved preference selected and the agent-active model annotated"
      - "When no models are available, the selector is disabled with an explanatory message and saving is impossible"
      - "All new strings exist in both en-US and zh-CN; types.ts compiles; renderer tests pass"
