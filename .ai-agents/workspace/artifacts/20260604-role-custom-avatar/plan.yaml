  - id: t4-ipc-handlers-preload
    title: IPC handlers and preload API for avatar endpoints
    status: in_progress
    completed_at: null
    depends_on:
      - t3-service-avatar-processing
    skill_hint: mvt-implement
    artifacts:
      files:
        - apps/electron/src/ipc-handlers/organization-handlers.ts
        - apps/electron/src/preload/exposed-api.ts
    notes: >
      Expose avatar API to renderer via IPC. Add three IPC handlers:
      capibara:role:upload-avatar (roleId, imageBuffer, mimeType) - converts
      ArrayBuffer to Buffer, calls service, returns dimensions.
      capibara:role:remove-avatar (roleId) - calls service removeAvatar.
      capibara:role:get-avatar (roleId) - calls service getAvatar, converts
      Buffer to ArrayBuffer, returns base64 encoded data. Update preload API to
      expose these methods to renderer context. Refer to design artifact Key
      Interfaces section.
    acceptance:
      - IPC handlers registered for all three avatar endpoints
      - Upload handler converts ArrayBuffer to Buffer correctly
      - Get handler converts Buffer to ArrayBuffer for IPC
      - Preload API exposes avatar methods to renderer
      - tsc clean; existing tests pass
