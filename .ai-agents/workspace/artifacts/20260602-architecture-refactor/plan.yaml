      After this, flip the no-cross-module-concrete guard rule from warn to error.
    acceptance:
      - "4 service + 3 engine interfaces exist; cross-module call sites import interfaces, not concrete classes"
      - "Cross-module concrete-import count is 0 (arch:check no-cross-module-concrete = error, passes)"
      - "composition-root binds concretes to interfaces; app boots (startup smoke test)"
      - "tsc clean; existing tests pass"

  - id: "t6-eventize-routing-remove-cascade"
