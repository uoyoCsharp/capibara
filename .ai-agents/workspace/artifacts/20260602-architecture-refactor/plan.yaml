        - "apps/electron/src/core/modules/conversation/interfaces/i-conversation-command.service.ts"
        - "apps/electron/src/core/modules/organization/interfaces/i-role-query.service.ts"
        - "apps/electron/src/core/modules/planning/interfaces/i-planning.service.ts"
        - "apps/electron/src/core/bootstrap/composition-root.ts"
    notes: >
      ADR-12 (breaking, pre-authorized). Phase 1 — follows the full Phase 0 safety net.
      Extract ITaskService, IConversationCommandService, IRoleQueryService, IPlanningService
