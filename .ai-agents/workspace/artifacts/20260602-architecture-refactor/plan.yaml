tasks:
  - id: "t1-layering-ci-guard"
    title: "G-1: Layering CI guard (dependency-cruiser) + arch:check gate"
    status: in_progress
    completed_at: null
    depends_on: []
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/.dependency-cruiser.cjs"
        - "apps/electron/package.json"
    notes: >
      ADR-02. Add .dependency-cruiser.cjs with 4 forbidden rules (no-core-to-adapters,
      d0-must-stay-leaf, no-upward-d1-to-d3, no-cross-module-concrete) + the design §8.2
      allowed-edge whitelist. Add "arch:check" npm script (depcruise ... exit code gates CI).
      Per ADR-12/Q4: prefer explicit per-module whitelist edges over capture-group backref.
      Existing violations exist now — set those rules to "warn" initially, flip to "error"
      as later OPs fix them (decide warn-baseline vs allow-list at implement time).
      This must land FIRST so every subsequent PR is gated.
    acceptance:
      - "npx depcruise apps/electron/src/core --config apps/electron/.dependency-cruiser.cjs runs and exits 0 (with current violations as warn)"
      - "package.json has an arch:check script invoking depcruise"
      - "The 4 forbidden rules + §8.2 whitelist are present in the config"

  - id: "t2-sink-plan-tree-invariants"
    title: "G-2: Sink plan-tree node/depth invariants into PlanningService"
    status: pending
    completed_at: null
    depends_on: ["t1-layering-ci-guard"]
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/core/modules/planning/validation/plan-tree.validator.ts"
        - "apps/electron/src/core/modules/planning/planning.service.ts"
        - "apps/electron/src/core/modules/mcp/handlers/plan-tree-tools.ts"
    notes: >
      ADR-03 (breaking, pre-authorized). Move validatePlanTree() + MAX_TREE_NODES/DEPTH +
      countNodes/measureDepth out of mcp/handlers/plan-tree-tools.ts into
      planning/validation/plan-tree.validator.ts. Enforce in PlanningService at BOTH submit
      and approvePending entry points; add explicit state guard at approve (B-5). MCP handler
      keeps only Zod/shape pre-parse and forwards; domain throws typed PlanTreeValidationError,
      adapter maps to tool error (preserve existing error code set). Non-MCP paths must no
      longer bypass limits.
    acceptance:
      - "MAX_TREE_NODES/MAX_TREE_DEPTH/measureDepth appear under modules/planning/, not in mcp/handlers/plan-tree-tools.ts"
      - "PlanningService.submit and approvePending both run validatePlanTree and reject on violation"
      - "MCP plan_submit_tree still returns the same error codes (mapped from domain errors)"
      - "tsc clean; existing tests pass; new submit+approve validation tests added"

  - id: "t3-fk-cascade-migration"
    title: "G-3: conversations.task_id -> ON DELETE CASCADE via table-rebuild migration v6"
    status: pending
    completed_at: null
    depends_on: ["t1-layering-ci-guard"]
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/core/infrastructure/persistence/sqlite/migrations.ts"
    notes: >
      ADR-04 + ADR-11 (breaking, pre-authorized; destructive at DB layer). Append migration
      version: 6. SQLite table-rebuild in one transaction: PRAGMA foreign_keys=OFF -> create
      conversations_new with task_id REFERENCES tasks(id) ON DELETE CASCADE (changed from SET
      NULL) -> INSERT INTO ... SELECT * -> DROP old -> RENAME -> recreate every index that
      existed on conversations -> PRAGMA foreign_keys=ON. Do NOT edit migrations v1-v5.
      Code-level removal of the app-layer cascade loop is deferred to t6 (OP-10).
      No task:deleted event is added. Test against a populated DB to confirm cascade range.
    acceptance:
      - "Migration v6 exists; conversations.task_id FK is ON DELETE CASCADE after migration"
      - "Deleting a task cascade-deletes its conversations (and their messages/suspensions via own FKs)"
      - "All indexes formerly on conversations are recreated; migrations v1-v5 unchanged"
      - "tsc clean; migration applies cleanly on a populated test DB"

  - id: "t4-pending-wakes-idempotency"
    title: "G-4: pending_wakes dedup unique index (v7) + INSERT OR IGNORE + idempotency contract"
    status: pending
    completed_at: null
    depends_on: ["t1-layering-ci-guard"]
    skill_hint: mvt-implement
    artifacts:
      files:
        - "apps/electron/src/core/infrastructure/persistence/sqlite/migrations.ts"
        - "apps/electron/src/core/modules/orchestrator/persistence"
        - "apps/electron/src/core/modules/orchestrator/orchestrators/conversation.orchestrator.ts"
    notes: >
      ADR-05 + ADR-06 (breaking, pre-authorized). Append migration version: 7. First
      de-duplicate existing rows (keep MIN(id) per natural key), then CREATE UNIQUE INDEX
      ux_pending_wakes_dedup ON pending_wakes(org_id, role_id, COALESCE(task_id,''),
      COALESCE(conversation_id,''), reason) — COALESCE sentinel because SQLite treats NULLs
      as distinct. Change pendingWakeRepo.create() to INSERT OR IGNORE against the index so
      onResponseNeeded() is idempotent under event re-delivery. Codify §12.4 idempotency
      contract as team standard + add PR-template field "how is this subscriber idempotent?".
    acceptance:
      - "Migration v7 creates ux_pending_wakes_dedup with COALESCE expressions; pre-existing dup rows removed"
      - "pendingWakeRepo.create uses INSERT OR IGNORE; re-delivered conversation:response-needed produces no duplicate wake"
      - "Idempotency contract documented; PR template gains the idempotency field"
      - "tsc clean; existing tests pass; re-delivery dedup test added"

  - id: "t5-extract-service-engine-interfaces"
