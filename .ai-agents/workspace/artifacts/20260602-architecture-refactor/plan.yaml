        - "apps/electron/src/core/modules/conversation/services/conversation.service.ts"
        - "apps/electron/src/core/modules/workflow/services/task.service.ts"
    notes: >
      ADR-07 + ADR-04/11 (breaking, pre-authorized). OP-3: add conversation:route-resolved
      event (events.ts + Zod schema). InquiryRouter publishes the routing decision instead of
      calling conversationService.assignRespondent directly; Conversation subscribes and applies
