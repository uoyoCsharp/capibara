appId: com.capibara.desktop
productName: Capibara
directories:
  buildResources: assets
  output: build/release
files:
  - out/**
  - package.json
  - assets/icon.png
extraResources:
  - from: resources/templates
    to: templates
    filter:
      - "**/*.json"
asar: true

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  icon: assets/icon.png
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: uoyoCsharp
  repo: capibara
  releaseType: release
